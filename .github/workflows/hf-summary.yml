name: Generate repo summary (Hugging Face)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Determine file to summarize
        id: choose
        run: |
          if [ -f README.md ] || [ -f readme.md ]; then
            echo "file=README.md" >> $GITHUB_OUTPUT
          elif [ -f public/index.html ]; then
            echo "file=public/index.html" >> $GITHUB_OUTPUT
          else
            echo "file=" >> $GITHUB_OUTPUT
          fi

      - name: Create text to summarize
        id: prepare
        run: |
          FILE="${{ steps.choose.outputs.file }}"
          if [ -z "$FILE" ]; then
            echo "No file to summarize found." >&2
            exit 0
          fi
          if [[ "$FILE" == *.html ]]; then
            python - <<'PY'
import sys, re
p = sys.stdin.read()
p = re.sub(r'(?s)<script.*?>.*?</script>', '', p)
p = re.sub(r'(?s)<style.*?>.*?</style>', '', p)
p = re.sub(r'<[^>]+>', ' ', p)
print(p)
PY < "$FILE" > repo_text.txt
          else
            cp "$FILE" repo_text.txt
          fi
          wc -c repo_text.txt || true

      - name: Call Hugging Face Inference API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL: "facebook/bart-large-cnn"
        run: |
          if [ ! -f repo_text.txt ]; then
            echo "No text to summarize; skipping."
            exit 0
          fi
          INPUT=$(cat repo_text.txt)
          MAX=100000
          LEN=${#INPUT}
          if [ $LEN -gt $MAX ]; then
            echo "Input too long ($LEN bytes), truncating to $MAX"
            echo "${INPUT:0:$MAX}" > repo_text.txt
            INPUT=$(cat repo_text.txt)
          fi
          PAYLOAD=$(jq -Rn --arg txt "$INPUT" '{"inputs":$txt}')
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api-inference.huggingface.co/models/$MODEL")
          echo "$RESPONSE" > hf_response.json
          if echo "$RESPONSE" | jq -e '.[0].summary_text' >/dev/null 2>&1; then
            SUMMARY=$(echo "$RESPONSE" | jq -r '.[0].summary_text')
          else
            SUMMARY=$(echo "$RESPONSE" | jq -r '. | tostring')
          fi
          echo "$SUMMARY" > SUMMARY.md

      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f SUMMARY.md ]; then
            git add SUMMARY.md
            git commit -m "chore: update AI-generated summary [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "No SUMMARY.md generated"
          fi
