name: Site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check links and assets
        run: node tools/check-links.mjs
